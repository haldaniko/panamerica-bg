server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /django-admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /static/ { alias /app/staticfiles/; }
    location /media/ { alias /app/media/; }
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ /index.html; }
}
