services:
  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:5173}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Pan America BG}
    volumes:
      - ./backend:/app
      - ./database:/database
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  article-scheduler:
    build: ./backend
    restart: unless-stopped
    command: ["python", "manage.py", "run_article_scheduler"]
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:5173}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Pan America BG}
      ARTICLE_SCHEDULER_POLL_SECONDS: ${ARTICLE_SCHEDULER_POLL_SECONDS:-60}
    volumes:
      - ./backend:/app
      - ./database:/database
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:

networks:
  default:
    name: panamerica-bg_default
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.250.0/24
          gateway: 172.16.250.1
